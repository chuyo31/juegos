<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#071217">
  <title>Chuyo Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">🎮</div>
      <div><strong>CHUYO</strong><span>GAMES</span></div>
    </div>
    <div class="header-right">
      <span id="gameCount">0 juegos</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="eyebrow">GAME PORTAL</span>
        <h1>Juega.<br><em>Descubre.</em></h1>
        <p>Una colección de juegos web y descargables creados por Chuyo.</p>
      </div>
      <div class="hero-badge">PLAY<br><b>NOW</b></div>
    </section>

    <section class="toolbar">
      <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar juegos..."></div>
      <div id="categories" class="categories"></div>
    </section>

    <section id="games" class="games-grid"></section>
    <div id="empty" class="empty hidden">No se han encontrado juegos.</div>
  </main>

  <footer>© <span id="year"></span> Chuyo Games · Juegos web y descargables</footer>
  <script src="js/app.js"></script>
</body>
</html>
